<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>
<body>
    <div class="error-page">
        <div class="error-container">
            <div class="error-content">
                <div class="error-cards">
                    <div class="card red dealt">
                        <div class="card-rank">4</div>
                        <div class="card-suit">♥</div>
                    </div>
                    <div class="card black dealt">
                        <div class="card-rank">0</div>
                        <div class="card-suit">♠</div>
                    </div>
                    <div class="card red dealt">
                        <div class="card-rank">4</div>
                        <div class="card-suit">♦</div>
                    </div>
                </div>
                
                <h1 class="error-title">Oops! Wrong Table</h1>
                <p class="error-message">
                    Looks like you've wandered into the wrong poker room. 
                    The page you're looking for doesn't exist.
                </p>
                
                <div class="error-actions">
                    <a href="/" class="btn btn-primary btn-large">
                        <i class="fas fa-home"></i>
                        Back to Poker Table
                    </a>
                    <button onclick="history.back()" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i>
                        Go Back
                    </button>
                </div>
            </div>
            
            <div class="floating-chips">
                <div class="chip chip-1"></div>
                <div class="chip chip-2"></div>
                <div class="chip chip-3"></div>
                <div class="chip chip-4"></div>
                <div class="chip chip-5"></div>
            </div>
        </div>
    </div>

    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(239, 68, 68, 0.1) 0%, transparent 70%),
                linear-gradient(135deg, var(--dark-bg) 0%, var(--darker-bg) 100%);
        }

        .error-container {
            text-align: center;
            z-index: 10;
            position: relative;
        }

        .error-content {
            background: linear-gradient(145deg, var(--card-bg), rgba(30, 41, 59, 0.95));
            border: 1px solid var(--border-color);
            border-radius: 32px;
            padding: 4rem 3rem;
            max-width: 700px;
            box-shadow: 
                var(--shadow-2xl),
                0 0 60px rgba(239, 68, 68, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .error-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--danger-color), var(--warning-color), var(--primary-color));
            border-radius: 32px 32px 0 0;
        }

        .error-content::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.05) 0%, transparent 70%);
            animation: errorGlow 8s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes errorGlow {
            0%, 100% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
        }

        .error-cards {
            display: flex;
            justify-content: center;
            gap: -15px;
            margin-bottom: 3rem;
            perspective: 1000px;
        }

        .error-cards .card {
            width: 90px;
            height: 126px;
            transform: rotate(-15deg) rotateY(10deg);
            margin: 0 -8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(239, 68, 68, 0.3);
            animation: cardFloat 4s ease-in-out infinite;
        }

        .error-cards .card:hover {
            transform: rotate(-15deg) rotateY(25deg) translateY(-10px);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(239, 68, 68, 0.5);
        }

        .error-cards .card:nth-child(1) {
            animation-delay: 0s;
        }

        .error-cards .card:nth-child(2) {
            transform: rotate(0deg) rotateY(0deg);
            z-index: 2;
            animation-delay: 0.5s;
        }

        .error-cards .card:nth-child(2):hover {
            transform: rotate(0deg) rotateY(15deg) translateY(-15px);
        }

        .error-cards .card:nth-child(3) {
            transform: rotate(15deg) rotateY(-10deg);
            animation-delay: 1s;
        }

        .error-cards .card:nth-child(3):hover {
            transform: rotate(15deg) rotateY(-25deg) translateY(-10px);
        }

        @keyframes cardFloat {
            0%, 100% { transform: rotate(var(--card-rotation, 0deg)) rotateY(var(--card-y-rotation, 0deg)) translateY(0px); }
            50% { transform: rotate(var(--card-rotation, 0deg)) rotateY(var(--card-y-rotation, 0deg)) translateY(-8px); }
        }

        .error-title {
            font-size: 3.5rem;
            background: linear-gradient(135deg, var(--danger-color), var(--warning-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1.5rem;
            font-weight: 800;
            animation: titlePulse 3s ease-in-out infinite alternate;
            position: relative;
        }

        .error-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--danger-color), transparent);
            border-radius: 2px;
            animation: underlinePulse 2s ease-in-out infinite alternate;
        }

        @keyframes titlePulse {
            from { filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.3)); }
            to { filter: drop-shadow(0 0 40px rgba(245, 158, 11, 0.5)); }
        }

        @keyframes underlinePulse {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        .error-message {
            font-size: 1.3rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            line-height: 1.7;
            font-weight: 400;
        }

        .error-actions {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .btn-large {
            padding: 1.5rem 3rem;
            font-size: 1.2rem;
            border-radius: 20px;
            min-width: 200px;
        }

        .error-actions .btn {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .error-actions .btn:hover {
            transform: translateY(-6px) scale(1.05);
        }

        .floating-chips {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .chip {
            position: absolute;
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, var(--primary-color), var(--secondary-color));
            border: 3px solid var(--gold);
            border-radius: 50%;
            opacity: 0.6;
            animation: chipFloat 8s ease-in-out infinite;
            box-shadow: 
                0 10px 20px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(99, 102, 241, 0.3);
        }

        .chip::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .chip-1 { 
            top: 15%; 
            left: 8%; 
            animation-delay: 0s; 
            --chip-size: 0.8;
        }
        .chip-2 { 
            top: 70%; 
            left: 12%; 
            animation-delay: 1.5s; 
            --chip-size: 1.2;
        }
        .chip-3 { 
            top: 25%; 
            right: 15%; 
            animation-delay: 3s; 
            --chip-size: 0.9;
        }
        .chip-4 { 
            bottom: 35%; 
            right: 8%; 
            animation-delay: 4.5s; 
            --chip-size: 1.1;
        }
        .chip-5 { 
            bottom: 15%; 
            left: 18%; 
            animation-delay: 6s; 
            --chip-size: 0.7;
        }

        @keyframes chipFloat {
            0%, 100% { 
                transform: translateY(0px) rotate(0deg) scale(var(--chip-size, 1)); 
                opacity: 0.4;
            }
            25% { 
                transform: translateY(-30px) rotate(90deg) scale(calc(var(--chip-size, 1) * 1.1)); 
                opacity: 0.8;
            }
            50% { 
                transform: translateY(-15px) rotate(180deg) scale(var(--chip-size, 1)); 
                opacity: 0.6;
            }
            75% { 
                transform: translateY(-25px) rotate(270deg) scale(calc(var(--chip-size, 1) * 0.9)); 
                opacity: 0.7;
            }
        }

        @media (max-width: 768px) {
            .error-content {
                padding: 3rem 2rem;
                margin: 1rem;
                border-radius: 24px;
            }
            
            .error-title {
                font-size: 2.5rem;
            }
            
            .error-message {
                font-size: 1.1rem;
            }
            
            .error-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 280px;
            }

            .btn-large {
                padding: 1.25rem 2.5rem;
                font-size: 1.1rem;
            }

            .error-cards .card {
                width: 70px;
                height: 98px;
            }

            .chip {
                width: 35px;
                height: 35px;
            }

            .chip::before {
                width: 12px;
                height: 12px;
            }
        }

        @media (max-width: 480px) {
            .error-content {
                padding: 2.5rem 1.5rem;
            }

            .error-title {
                font-size: 2rem;
            }

            .error-cards {
                gap: -20px;
                margin-bottom: 2rem;
            }

            .error-cards .card {
                width: 60px;
                height: 84px;
                margin: 0 -10px;
            }
        }
    </style>
</body>
</html>
